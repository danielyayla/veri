# WO-080: automated dependency updates for every ecosystem in the repo.
# npm at "/" covers all workspaces (single root lockfile); cargo covers the
# Tauri shell's Rust crate.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/packages/ui/src-tauri"
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
