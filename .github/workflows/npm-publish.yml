# WO-081 / DEC-077 / WO-140: manual npm publish for the three public
# packages — @verikb/core, @verikb/cli, @verikb/mcp. Never tag-triggered: the
# v* namespace is shared and guarded (DEC-075), and publishing stays a
# deliberate maintainer act. Dry-run is the default. Authentication is
# npm trusted publishing (OIDC, WO-140): the job mints a short-lived
# token from its GitHub identity — no NPM_TOKEN secret, and no 2FA OTP,
# which no repository secret could ever supply (SRC-065).
name: npm-publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no packages actually published)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing (WO-140)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url: that input writes an _authToken line into
      # .npmrc, and trusted publishing needs no token at all.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Trusted publishing needs npm >= 11.5.1 to exchange the OIDC
      # token; Node 22 bundles npm 10.x.
      - run: npm install -g npm@latest && npm --version

      - run: npm ci

      # Builds every package, then runs every test suite — the same
      # bar as CI. Nothing publishes off a red tree.
      - run: npm test

      - name: Check version lockstep (DEC-077)
        run: |
          core=$(node -p "require('./packages/core/package.json').version")
          cli=$(node -p "require('./packages/cli/package.json').version")
          mcp=$(node -p "require('./packages/mcp/package.json').version")
          echo "core=$core cli=$cli mcp=$mcp"
          if [ "$core" != "$cli" ] || [ "$core" != "$mcp" ]; then
            echo "::error::@verikb/core, @verikb/cli, and @verikb/mcp must share one version (DEC-077 lockstep)"
            exit 1
          fi

      - name: Publish (dry-run ${{ inputs.dry_run }})
        run: |
          flag=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then flag="--dry-run"; fi
          for w in @verikb/core @verikb/cli @verikb/mcp; do
            npm publish --workspace "$w" $flag
          done
