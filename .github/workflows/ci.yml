name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # WO-092 / REQ-030: the pure-Node packages (core, cli, mcp, action) must
  # test green on all three platforms. Ubuntu stays the full job — every
  # workspace's suite, typecheck, veri check, and the action-bundle
  # freshness proof; macOS and Windows run the four Node package suites.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The repo's files are authored LF; tests and the action-bundle diff
      # compare byte content, so stop Git for Windows' autocrlf rewriting
      # the checkout.
      - name: Keep the checkout byte-identical (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Typecheck (all workspaces)
        if: matrix.os == 'ubuntu-latest'
        run: npm run typecheck

      - name: Test
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            npm test
          else
            npm run build
            npm test -w @veri/core -w @veri/cli -w @veri/mcp -w @veri/action
          fi

      - name: veri check (this repo enforces its own rules)
        if: matrix.os == 'ubuntu-latest'
        run: node packages/cli/dist/cli.js check

      - name: action bundle is current (npm test rebuilt it from source)
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- action/dist
