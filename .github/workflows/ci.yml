name: CI

on:
  push:
    branches: [main, my]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: veri check (this repo enforces its own rules)
        run: node packages/cli/dist/cli.js check
      - name: action bundle is current (npm test rebuilt it from source)
        run: git diff --exit-code -- action/dist
