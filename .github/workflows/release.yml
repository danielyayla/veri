# WO-028: pushing a version tag (v0.2.0) builds, signs, notarizes, and
# publishes the macOS app plus the electron-updater feed metadata
# (latest-mac.yml, blockmaps) to a GitHub Release. The tag is the only
# manual step.
#
# When the signing secrets are not configured, the build falls back to
# an unsigned, un-notarized app so the rest of the pipeline can be
# exercised; installs will hit Gatekeeper warnings.
#
# Required repository secrets for signed builds:
#   CSC_LINK                     base64 .p12 of the Developer ID
#                                Application certificate
#   CSC_KEY_PASSWORD             its passphrase
#   APPLE_ID                     Apple ID for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that ID
#   APPLE_TEAM_ID                developer team id
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload artifacts

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match the app version
        run: |
          APP_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${APP_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != packages/ui version v${APP_VERSION}" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - run: npm test

      # WO-033: electron-builder must not touch the release API. Its
      # per-target publishers race to create the release, and GitHub's
      # REST list-releases endpoint (their find-existing path) serves
      # stale results, so even a pre-created draft gets duplicated
      # (observed on the v0.1.1 and v0.1.2 runs). CI creates the one
      # draft, electron-builder only builds, and CI uploads serially.
      - name: Create the release draft up front
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
              --title "${GITHUB_REF_NAME}"
          fi

      - name: Package, sign, notarize
        working-directory: packages/ui
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac --publish never
          else
            echo "::warning::Signing secrets not set; building unsigned, un-notarized app"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --publish never -c.mac.notarize=false
          fi

      - name: Upload artifacts and update feed to the draft
        working-directory: packages/ui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            "release/Veri-${version}-universal.dmg" \
            "release/Veri-${version}-universal.dmg.blockmap" \
            "release/Veri-${version}-universal-mac.zip" \
            "release/Veri-${version}-universal-mac.zip.blockmap" \
            "release/latest-mac.yml"

      # WO-033: fail loudly if the feed is split or incomplete — a
      # partial latest-mac.yml release would break auto-update. Counts
      # via GraphQL: the REST list endpoint is the one that serves
      # stale results.
      - name: Verify one complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh api graphql \
            -F owner='${{ github.repository_owner }}' \
            -F repo='${{ github.event.repository.name }}' \
            -f query='query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                releases(first: 100) {
                  nodes { tagName releaseAssets(first: 50) { nodes { name } } }
                }
              }
            }' --jq "[.data.repository.releases.nodes[] | select(.tagName == \"${GITHUB_REF_NAME}\")]")
          count=$(jq length <<< "$releases")
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly 1 release for ${GITHUB_REF_NAME}, found ${count}" >&2
            exit 1
          fi
          assets=$(jq -r '.[0].releaseAssets.nodes[].name' <<< "$releases")
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for f in "Veri-${version}-universal.dmg" \
                   "Veri-${version}-universal.dmg.blockmap" \
                   "Veri-${version}-universal-mac.zip" \
                   "Veri-${version}-universal-mac.zip.blockmap" \
                   "latest-mac.yml"; do
            if ! grep -qxF "$f" <<< "$assets"; then
              echo "Missing release asset: $f" >&2
              missing=1
            fi
          done
          exit $missing
