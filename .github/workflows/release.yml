# WO-073: pushing a version tag (v0.2.0) builds, signs, notarizes, and
# publishes the Tauri app — per-architecture DMGs plus the tauri-updater
# feed (latest.json, .app.tar.gz archives with minisign signatures) — to a
# GitHub Release. The tag is the only manual step.
#
# When the Apple signing secrets are not configured, the build falls back
# to an ad-hoc-signed, un-notarized app so the rest of the pipeline can be
# exercised; installs will hit Gatekeeper warnings. The updater signing key
# is NOT optional: without signed archives, installed apps refuse the feed.
#
# Required repository secrets for signed builds:
#   CSC_LINK                     base64 .p12 of the Developer ID
#                                Application certificate (same secret the
#                                Electron pipeline used; tauri reads it as
#                                APPLE_CERTIFICATE)
#   CSC_KEY_PASSWORD             its passphrase
#   APPLE_ID                     Apple ID for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that ID
#   APPLE_TEAM_ID                developer team id
#   TAURI_SIGNING_PRIVATE_KEY    minisign private key for updater archives
#                                (generated with `tauri signer generate`;
#                                the matching pubkey lives in
#                                packages/ui/src-tauri/tauri.conf.json)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if none)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload artifacts

jobs:
  # WO-079 / DEC-075: app releases and the action's version tags (v1,
  # v1.0.0, …) share the v* namespace. The guard tells them apart instead
  # of failing: only a tag equal to v<packages/ui version> is an app
  # release; anything else passes through green with a notice. An app
  # release additionally requires its CHANGELOG.md section up front, so a
  # missing entry fails here in seconds, not after a ten-minute build.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this tag an app release?
        id: decide
        run: |
          APP_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if [ "${GITHUB_REF_NAME}" = "v${APP_VERSION}" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag ${GITHUB_REF_NAME} does not match the app version (v${APP_VERSION}) — treating it as a non-release tag (e.g. the action's major tag) and skipping the app release. See RELEASING.md."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: App releases require a changelog entry
        if: steps.decide.outputs.proceed == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          section=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -z "$(printf "%s" "$section" | tr -d "[:space:]")" ]; then
            echo "CHANGELOG.md has no '## [${version}]' section — move the Unreleased entries under it before tagging (see RELEASING.md)" >&2
            exit 1
          fi

  release:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Rust targets (arm64 runner cross-builds x64)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Fetch the bundled Node runtime (both architectures)
        working-directory: packages/ui
        run: node scripts/fetch-node.mjs --target=all

      - name: Stage the sidecar tree
        working-directory: packages/ui
        run: node scripts/stage-sidecar.mjs

      # Tauri's bundler imports APPLE_CERTIFICATE into a temporary keychain,
      # signs with the hardened runtime + entitlements.plist, and notarizes
      # via notarytool — no separate keychain step needed.
      - name: Build, sign, notarize (per architecture)
        working-directory: packages/ui
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set — updater archives cannot be signed" >&2
            exit 1
          fi
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::Apple signing secrets not set; building ad-hoc-signed, un-notarized app"
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build --target aarch64-apple-darwin
          npx tauri build --target x86_64-apple-darwin

      # Renames the per-arch updater archives apart, writes latest.json, and
      # fails the release if a DMG crosses REQ-023's 50 MB ceiling. SIZES.md
      # becomes the release notes, so every release states its sizes.
      - name: Assemble release assets and updater manifest
        working-directory: packages/ui
        run: node scripts/make-updater-manifest.mjs

      # WO-079: release notes are "What's new" from CHANGELOG.md (the guard
      # already proved the section exists) above the SIZES.md manifest, so
      # every release states its changes and its sizes.
      - name: Assemble release notes (what's new + sizes)
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## What's new in ${version}"
            echo
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" {found=1; next}
              found && /^## \[/ {exit}
              found {print}
            ' CHANGELOG.md
            echo
            cat packages/ui/src-tauri/release-assets/SIZES.md
          } > packages/ui/src-tauri/release-assets/NOTES.md

      # WO-033's lesson carried over: CI creates the one draft and uploads
      # serially; the build tool never touches the release API.
      - name: Create the release draft up front
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file packages/ui/src-tauri/release-assets/NOTES.md
          fi

      - name: Upload artifacts and update feed to the draft
        working-directory: packages/ui/src-tauri/release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            "Veri_${version}_aarch64.dmg" \
            "Veri_${version}_x64.dmg" \
            "Veri_${version}_aarch64.app.tar.gz" \
            "Veri_${version}_aarch64.app.tar.gz.sig" \
            "Veri_${version}_x64.app.tar.gz" \
            "Veri_${version}_x64.app.tar.gz.sig" \
            "latest.json"

      # WO-033: fail loudly if the feed is split or incomplete — a partial
      # latest.json release would break auto-update. Counts via GraphQL: the
      # REST list endpoint serves stale results.
      - name: Verify one complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh api graphql \
            -F owner='${{ github.repository_owner }}' \
            -F repo='${{ github.event.repository.name }}' \
            -f query='query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                releases(first: 100) {
                  nodes { tagName releaseAssets(first: 50) { nodes { name } } }
                }
              }
            }' --jq "[.data.repository.releases.nodes[] | select(.tagName == \"${GITHUB_REF_NAME}\")]")
          count=$(jq length <<< "$releases")
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly 1 release for ${GITHUB_REF_NAME}, found ${count}" >&2
            exit 1
          fi
          assets=$(jq -r '.[0].releaseAssets.nodes[].name' <<< "$releases")
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for f in "Veri_${version}_aarch64.dmg" \
                   "Veri_${version}_x64.dmg" \
                   "Veri_${version}_aarch64.app.tar.gz" \
                   "Veri_${version}_aarch64.app.tar.gz.sig" \
                   "Veri_${version}_x64.app.tar.gz" \
                   "Veri_${version}_x64.app.tar.gz.sig" \
                   "latest.json"; do
            if ! grep -qxF "$f" <<< "$assets"; then
              echo "Missing release asset: $f" >&2
              missing=1
            fi
          done
          exit $missing
