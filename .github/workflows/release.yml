# WO-073 / WO-092: pushing a version tag (v0.2.0) builds and publishes the
# Tauri app for every supported platform — signed/notarized per-architecture
# macOS DMGs, a Linux AppImage and .deb, and a Windows NSIS installer — plus
# the tauri-updater feed (latest.json and minisign-signed updater artifacts)
# to one GitHub Release. The tag is the only manual step.
#
# Each platform builds on its own runner and uploads a workflow artifact;
# the publish job merges them, gates every installer at REQ-023's 50 MB
# ceiling, assembles the notes, and creates the one draft release.
#
# Signing posture (DEC-082, proposed): macOS artifacts are Developer
# ID-signed and notarized; the Windows installer is NOT Authenticode-signed
# (SmartScreen warns on first install); Linux artifacts follow the
# platform's norm of no code signing. Every updater artifact on every
# platform carries a minisign signature the installed app verifies.
#
# When the Apple signing secrets are not configured, the macOS build falls
# back to an ad-hoc-signed, un-notarized app so the rest of the pipeline can
# be exercised; installs will hit Gatekeeper warnings. The updater signing
# key is NOT optional on any platform: without signed artifacts, installed
# apps refuse the feed.
#
# Required repository secrets for signed builds:
#   CSC_LINK                     base64 .p12 of the Developer ID
#                                Application certificate (same secret the
#                                Electron pipeline used; tauri reads it as
#                                APPLE_CERTIFICATE)
#   CSC_KEY_PASSWORD             its passphrase
#   APPLE_ID                     Apple ID for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that ID
#   APPLE_TEAM_ID                developer team id
#   TAURI_SIGNING_PRIVATE_KEY    minisign private key for updater artifacts
#                                (generated with `tauri signer generate`;
#                                the matching pubkey lives in
#                                packages/ui/src-tauri/tauri.conf.json)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if none)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload artifacts

jobs:
  # WO-079 / DEC-075: app releases and the action's version tags (v1,
  # v1.0.0, …) share the v* namespace. The guard tells them apart instead
  # of failing: only a tag equal to v<packages/ui version> is an app
  # release; anything else passes through green with a notice. An app
  # release additionally requires its CHANGELOG.md section up front, so a
  # missing entry fails here in seconds, not after a ten-minute build.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this tag an app release?
        id: decide
        run: |
          APP_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if [ "${GITHUB_REF_NAME}" = "v${APP_VERSION}" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag ${GITHUB_REF_NAME} does not match the app version (v${APP_VERSION}) — treating it as a non-release tag (e.g. the action's major tag) and skipping the app release. See RELEASING.md."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: App releases require a changelog entry
        if: steps.decide.outputs.proceed == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          section=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -z "$(printf "%s" "$section" | tr -d "[:space:]")" ]; then
            echo "CHANGELOG.md has no '## [${version}]' section — move the Unreleased entries under it before tagging (see RELEASING.md)" >&2
            exit 1
          fi

  # WO-092: one job per platform, each producing its release assets plus a
  # manifest fragment (updater entries + sizes) for the publish job to merge.
  build:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            # The arm64 runner cross-builds the x64 slice.
            runner: macos-14
            node-target: all
          - platform: linux
            # Oldest supported LTS runner: the AppImage links this image's
            # glibc/webkit, so building here keeps it installable on older
            # distros (Tauri's own guidance).
            runner: ubuntu-22.04
            node-target: linux-x64
          - platform: windows
            runner: windows-latest
            node-target: win-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # The repo's files are authored LF; tests and staging compare and ship
      # byte content, so stop Git for Windows' autocrlf rewriting checkouts.
      - name: Keep the checkout byte-identical (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The documented Tauri v2 build dependencies for Ubuntu 22.04.
      - name: Linux system dependencies (Tauri v2)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Updater signing key must be present on every platform
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set — updater artifacts cannot be signed" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      # macOS runs the full suite (the app's own package included); the
      # other runners run the pure-Node package suites, matching the CI
      # matrix (WO-092/REQ-030) — cross-platform app behavior beyond that
      # is not provable on a build runner.
      - name: Test
        run: |
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            npm test
          else
            npm test -w @verikb/core -w @verikb/cli -w @verikb/mcp -w @verikb/action
          fi

      - name: Rust targets (arm64 runner cross-builds x64)
        if: matrix.platform == 'darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Fetch the bundled Node runtime
        working-directory: packages/ui
        run: node scripts/fetch-node.mjs --target=${{ matrix.node-target }}

      - name: Stage the sidecar tree
        working-directory: packages/ui
        run: node scripts/stage-sidecar.mjs

      # Tauri's bundler imports APPLE_CERTIFICATE into a temporary keychain,
      # signs with the hardened runtime + entitlements.plist, and notarizes
      # via notarytool — no separate keychain step needed.
      - name: Build, sign, notarize (macOS, per architecture)
        if: matrix.platform == 'darwin'
        working-directory: packages/ui
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::Apple signing secrets not set; building ad-hoc-signed, un-notarized app"
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build --target aarch64-apple-darwin
          npx tauri build --target x86_64-apple-darwin

      - name: Build (Linux — AppImage + .deb)
        if: matrix.platform == 'linux'
        working-directory: packages/ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles appimage,deb

      # Not Authenticode-signed (DEC-082, proposed): SmartScreen warns on
      # first install; the updater artifact still carries its minisign
      # signature, which the installed app verifies.
      - name: Build (Windows — NSIS)
        if: matrix.platform == 'windows'
        working-directory: packages/ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      # Collects this platform's bundles into release-assets/, writes the
      # manifest fragment, and fails here if an installer crosses REQ-023's
      # 50 MB ceiling — a size regression stops the platform job itself.
      - name: Collect release assets and manifest fragment
        working-directory: packages/ui
        run: node scripts/make-updater-manifest.mjs --platform=${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: packages/ui/src-tauri/release-assets/
          if-no-files-found: error

  publish:
    needs: [guard, build]
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: packages/ui/src-tauri/release-assets
          merge-multiple: true

      # Merges the three platform fragments into latest.json (failing if any
      # platform's build vanished), re-checks the size gate across all
      # installers, and writes SIZES.md (sizes + per-platform update-channel
      # caveats) and ASSETS.txt (the exact upload/verify list).
      - name: Merge the updater manifest and gate sizes
        working-directory: packages/ui
        run: node scripts/make-updater-manifest.mjs --merge

      # WO-079: release notes are "What's new" from CHANGELOG.md (the guard
      # already proved the section exists) above the SIZES.md manifest, so
      # every release states its changes, its sizes, and its caveats.
      - name: Assemble release notes (what's new + sizes)
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## What's new in ${version}"
            echo
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" {found=1; next}
              found && /^## \[/ {exit}
              found {print}
            ' CHANGELOG.md
            echo
            cat packages/ui/src-tauri/release-assets/SIZES.md
          } > packages/ui/src-tauri/release-assets/NOTES.md

      # WO-033's lesson carried over: CI creates the one draft and uploads
      # serially; the build tool never touches the release API.
      - name: Create the release draft up front
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file packages/ui/src-tauri/release-assets/NOTES.md
          fi

      - name: Upload artifacts and update feed to the draft
        working-directory: packages/ui/src-tauri/release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: xargs -a ASSETS.txt gh release upload "${GITHUB_REF_NAME}" --clobber

      # WO-033: fail loudly if the feed is split or incomplete — a partial
      # latest.json release would break auto-update. Counts via GraphQL: the
      # REST list endpoint serves stale results. The expected list is
      # ASSETS.txt, itself assembled from the per-platform fragments whose
      # collectors fail on any missing bundle.
      - name: Verify one complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh api graphql \
            -F owner='${{ github.repository_owner }}' \
            -F repo='${{ github.event.repository.name }}' \
            -f query='query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                releases(first: 100) {
                  nodes { tagName releaseAssets(first: 50) { nodes { name } } }
                }
              }
            }' --jq "[.data.repository.releases.nodes[] | select(.tagName == \"${GITHUB_REF_NAME}\")]")
          count=$(jq length <<< "$releases")
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly 1 release for ${GITHUB_REF_NAME}, found ${count}" >&2
            exit 1
          fi
          assets=$(jq -r '.[0].releaseAssets.nodes[].name' <<< "$releases")
          missing=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! grep -qxF "$f" <<< "$assets"; then
              echo "Missing release asset: $f" >&2
              missing=1
            fi
          done < packages/ui/src-tauri/release-assets/ASSETS.txt
          exit $missing
