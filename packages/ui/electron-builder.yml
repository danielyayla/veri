# Packaging for the Veri desktop app (WO-028).
#
# asar is disabled deliberately: the app writes the path of
# @veri/mcp's server.js into .mcp.json for agent clients to run with
# plain `node`, and @veri/cli scaffolds from real demo files on disk
# (DEC-007). Both need real files inside the installed bundle, not
# entries in an asar archive.
appId: io.github.danielyayla.veri
productName: Veri
directories:
  buildResources: build
  output: release # dist/ belongs to tsc
files:
  - dist/**
  - renderer/**
  - "!dist/**/*.test.*"
asar: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
    - target: zip # Squirrel.Mac updates install from the zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization reads APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID from the environment (CI secrets); the signing
  # identity comes from CSC_LINK / CSC_KEY_PASSWORD. Nothing here.
  notarize: true
publish:
  provider: github
  owner: danielyayla
  repo: veri
