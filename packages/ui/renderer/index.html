<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- No network, ever: everything must come from the app bundle. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'" />
  <title>Veri</title>
  <link rel="stylesheet" href="./fonts.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app"></div>
  <!-- Bundled by esbuild (DEC-021) so the CodeMirror packages resolve under
       script-src 'self'; dist/renderer/app.js is the unbundled tsc input. -->
  <script type="module" src="../dist/renderer/app.bundle.js"></script>
</body>
</html>
