<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Veri app icon, "check-V": a single stroke reading as both the letter V
       and a checkmark. Palette from the app: dark ground #0F0F11 family,
       ember accent #E8703A. Squircle body 824x824 rx 186 per the macOS
       Big Sur icon grid; corners are baked in (macOS does not mask). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C22"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#DE6430"/>
      <stop offset="1" stop-color="#F0A87E"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#2E2E36" stroke-width="4"/>
  <path d="M 300 406 L 486 712 L 726 312" fill="none" stroke="url(#ember)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
