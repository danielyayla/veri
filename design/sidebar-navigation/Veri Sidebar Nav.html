  :root {
    --bg: #0F0F11;
    --rail: #101013;
    --panel: #131316;
    --card: #151519;
    --card2: #17171B;
    --pop: #1A1A1F;
    --hair: #1E1E24;
    --border: #26262C;
    --pop-border: #2B2B32;
    --hover: #1B1B20;
    --sel: #1F1F25;
    --text: #E7E4DE;
    --body: #C9C6CF;
    --sec: #A09DA6;
    --muted: #8B8893;
    --faint: #6E6B76;
    --ghost: #55525E;
    --ember: #E8703A;
    --ember-hi: #F0A87E;
    --ember-tint: rgba(232,112,58,0.09);
    --req: #7EA6C4;
    --dec: #CFA83D;
    --wo: #E8703A;
    --src: #908BA8;
    --ok: #7FAF8A;
    --warn: #D9A03F;
    --sans: 'Source Sans 3', -apple-system, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    overflow: hidden;
  }
  .app { height: 100vh; display: flex; flex-direction: column; }

  /* ---------- topbar ---------- */
  .topbar {
    height: 44px; flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--hair);
  }
  .logo {
    width: 18px; height: 18px; border-radius: 4px; background: var(--ember);
    display: flex; align-items: center; justify-content: center;
    color: var(--bg); font-family: var(--mono); font-size: 11px; font-weight: 600;
  }
  .wordmark { font-weight: 600; font-size: 13px; letter-spacing: .2px; }
  .topbar .sep { color: var(--ghost); font-size: 13px; }
  .projname { font-family: var(--mono); font-size: 12px; color: var(--sec); }
  .top-center { flex: 1; display: flex; justify-content: center; }
  .searchbox {
    width: 340px; height: 28px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    color: var(--faint); font-size: 12.5px; cursor: pointer;
  }
  .searchbox:hover { border-color: #2E2E36; }
  .searchbox .q { flex: 1; }
  kbd {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    background: var(--card2); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 9px;
    border-radius: 6px; border: 1px solid var(--border);
    font-family: var(--mono); font-size: 11px; color: var(--sec);
    cursor: pointer; background: transparent; position: relative;
  }
  .chip:hover { border-color: #2E2E36; }
  .chip.warn {
    color: var(--warn); border-color: #3A3020;
    background: rgba(217,160,63,0.07);
  }

  /* ---------- shell ---------- */
  .shell { flex: 1; display: flex; min-height: 0; }

  /* ---------- primary sidebar ---------- */
  .sidebar {
    width: 216px; flex: none;
    background: var(--rail);
    border-right: 1px solid var(--hair);
    display: flex; flex-direction: column;
    padding: 10px 8px 8px;
  }
  .nav-item {
    height: 28px; flex: none;
    display: flex; align-items: center; gap: 9px;
    padding: 0 9px; border-radius: 6px;
    color: var(--body); font-size: 13px;
    cursor: pointer; user-select: none;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--ember-tint); color: var(--ember-hi); }
  .nav-item .glyph {
    width: 16px; flex: none; text-align: center;
    font-family: var(--mono); font-size: 13px; color: var(--muted);
  }
  .nav-item.active .glyph { color: var(--ember-hi); }
  .nav-item .swatch {
    width: 16px; flex: none; display: flex; justify-content: center;
  }
  .nav-item .swatch i {
    width: 7px; height: 7px; border-radius: 2px; display: block;
  }
  .nav-item .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .cnt {
    font-family: var(--mono); font-size: 10.5px; color: var(--ghost);
  }
  .nav-item.active .cnt { color: var(--ember-hi); opacity: .75; }
  .nav-item .caret {
    font-size: 9px; color: var(--ghost); width: 10px; text-align: center;
  }
  .nav-item.active .caret { color: var(--ember-hi); }
  .side-div { height: 1px; background: var(--hair); margin: 8px 6px; flex: none; }
  .side-fill { flex: 1; }

  .settings-row { position: relative; }
  .settings-row .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 0 1px var(--rail);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  /* settings popover */
  .settings-pop {
    position: absolute; left: 6px; bottom: 36px; width: 204px;
    background: var(--pop); border: 1px solid var(--pop-border); border-radius: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
    padding: 5px; z-index: 40; display: none;
  }
  .settings-pop.open { display: block; }
  .pop-label {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
    color: var(--faint); text-transform: uppercase; padding: 5px 8px 4px;
  }
  .pop-row {
    height: 28px; display: flex; align-items: center; gap: 9px;
    padding: 0 8px; border-radius: 5px; font-size: 12.5px; color: var(--body);
    cursor: pointer;
  }
  .pop-row:hover { background: var(--sel); }
  .pop-row .glyph { width: 14px; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .pop-row .meta { margin-left: auto; display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 9.5px; color: var(--ok); }
  .pop-div { height: 1px; background: var(--hair); margin: 4px 4px; }

  /* ---------- secondary type panel ---------- */
  .typepanel {
    width: 280px; flex: none;
    background: var(--panel);
    border-right: 1px solid var(--hair);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .typepanel.closed { display: none; }
  .tp-head {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 13px 12px 10px;
  }
  .tp-head i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tp-head .t {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--sec); flex: 1;
  }
  .tp-head .n { font-family: var(--mono); font-size: 10.5px; color: var(--ghost); }
  .tp-close {
    width: 20px; height: 20px; border-radius: 5px; border: none; background: none;
    color: var(--ghost); font-size: 11px; cursor: pointer; font-family: var(--mono);
  }
  .tp-close:hover { background: var(--hover); color: var(--sec); }
  .tp-filter { padding: 0 10px 10px; flex: none; }
  .tp-filter input {
    width: 100%; height: 27px; padding: 0 9px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: var(--mono); font-size: 11px; outline: none;
  }
  .tp-filter input::placeholder { color: var(--ghost); }
  .tp-filter input:focus { border-color: #8A4A2C; }
  .tp-list { flex: 1; overflow-y: auto; padding: 0 6px 10px; }
  .tp-group {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ghost);
    padding: 9px 8px 4px;
  }
  .tp-row {
    min-height: 28px; display: flex; align-items: center; gap: 8px;
    padding: 3px 8px; border-radius: 6px; cursor: pointer;
  }
  .tp-row:hover { background: var(--hover); }
  .tp-row.active { background: var(--ember-tint); }
  .tp-row .id {
    font-family: var(--mono); font-size: 10px; flex: none; width: 52px;
  }
  .tp-row .ttl {
    flex: 1; font-size: 12.5px; color: #A8A5AF;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tp-row.active .ttl { color: var(--text); }
  .tp-row .st {
    font-family: var(--mono); font-size: 9px; flex: none;
  }
  .tp-row .star { font-size: 10px; color: var(--ember); flex: none; }
  .tp-more {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; font-size: 11.5px; color: var(--ghost);
    cursor: pointer; border-radius: 6px; font-family: var(--sans);
  }
  .tp-more:hover { color: var(--muted); }
  .tp-empty { padding: 14px 10px; font-size: 12px; color: var(--faint); }

  /* ---------- main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }

  .tabstrip {
    height: 37px; flex: none;
    display: flex; align-items: stretch;
    background: var(--panel);
    border-bottom: 1px solid var(--hair);
    overflow-x: auto; scrollbar-width: none;
  }
  .tab {
    display: flex; align-items: center; gap: 7px;
    padding: 0 8px 0 12px;
    border-right: 1px solid var(--hair);
    font-size: 12px; color: var(--muted);
    cursor: pointer; user-select: none; white-space: nowrap; max-width: 220px;
  }
  .tab .tid { font-family: var(--mono); font-size: 10px; }
  .tab .tttl { overflow: hidden; text-overflow: ellipsis; }
  .tab.preview .tttl { font-style: italic; }
  .tab.active {
    background: var(--bg); color: var(--text);
    box-shadow: inset 0 2px 0 var(--ember);
  }
  .tab .x {
    width: 16px; height: 16px; border-radius: 4px; border: none; background: none;
    color: transparent; font-size: 10px; cursor: pointer; font-family: var(--mono);
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .tab:hover .x, .tab.active .x { color: var(--ghost); }

  let tab = state.tabs.find(t => t.key === key);
  if (!tab) {
    tab = key.startsWith('view:')
      ? { key, kind: 'view', view: key.slice(5), preview: !pin }
      : { key, kind: 'doc', id: key.slice(4), preview: !pin };
    const pv = state.tabs.findIndex(t => t.preview);
    if (tab.preview && pv !== -1) state.tabs.splice(pv, 1, tab);
    else state.tabs.push(tab);
  } else if (pin) tab.preview = false;
  state.activeTab = key;
  render();
}
function pinTab(key) {
  const t = state.tabs.find(t => t.key === key);
  if (t) { t.preview = false; render(); }
}
function closeTab(key) {
  const i = state.tabs.findIndex(t => t.key === key);
  if (i === -1) return;
  state.tabs.splice(i, 1);
  if (!state.tabs.length) state.tabs.push({ key: 'view:home', kind: 'view', view: 'home', preview: false });
  if (state.activeTab === key) state.activeTab = state.tabs[Math.max(0, i - 1)].key;
  render();
}
function openDoc(id, opts) { openTab('doc:' + id, opts); }
function openView(v, opts) { openTab('view:' + v, opts); }
function openSettings(section) {
  if (section) state.settingsSection = section;
  state.settingsPopOpen = false;
  openView('settings');
}

/* ============ sidebar ============ */
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function livingCount(type) { return DOCS.filter(d => d.type === type && LIVING[type].includes(d.status)).length; }

function renderSidebar() {
  const active = state.tabs.find(t => t.key === state.activeTab);
  const curView = active && active.kind === 'view' ? active.view : null;
  const el = document.getElementById('sidebar');
  const viewItem = (v) => `
    <div class="nav-item ${curView === v ? 'active' : ''}" data-view="${v}">
      <span class="glyph">${VIEWS[v].glyph}</span><span class="lbl">${VIEWS[v].label}</span>
    </div>`;
  const collItem = (t) => `
    <div class="nav-item ${state.panel === t ? 'active' : ''}" data-coll="${t}">
      <span class="swatch"><i style="background:${TYPE[t].color}"></i></span>
      <span class="lbl">${TYPE[t].label}</span>
      <span class="cnt">${livingCount(t)}</span>
      <span class="caret">${state.panel === t ? '◂' : '▸'}</span>
    </div>`;
  el.innerHTML = `
    ${viewItem('home')}
    <div class="side-div"></div>
    ${collItem('req')}${collItem('dec')}${collItem('src')}${collItem('wo')}
    <div class="side-div"></div>
    ${viewItem('board')}${viewItem('graph')}
    <div class="side-fill"></div>
    <div class="settings-row">
      <div class="nav-item ${curView === 'settings' ? 'active' : ''}" id="settingsBtn">
        <span class="glyph">⚙︎</span><span class="lbl">Settings</span>
        <span class="dot" title="agent connected"></span>
      </div>
      <div class="settings-pop ${state.settingsPopOpen ? 'open' : ''}" id="settingsPop">
        <div class="pop-label">Project</div>
        <div class="pop-row" data-set="templates"><span class="glyph">⌧</span>Templates</div>
        <div class="pop-row" data-set="agent"><span class="glyph">⌁</span>Agent connection
          <span class="meta"><span class="dot" style="width:5px;height:5px;border-radius:50%;background:var(--ok);display:inline-block"></span>:7423</span></div>
        <div class="pop-row" data-set="project"><span class="glyph">▣</span>Project settings</div>
        <div class="pop-div"></div>
        <div class="pop-label">Application</div>
        <div class="pop-row" data-set="updates"><span class="glyph">↻</span>Updates
          <span class="meta" style="color:var(--ghost)">v0.9.2</span></div>
      </div>
    </div>`;
  el.querySelectorAll('[data-view]').forEach(n => {
    n.onclick = () => { state.panel = null; openView(n.dataset.view); };
    n.ondblclick = () => pinTab('view:' + n.dataset.view);
  });
  el.querySelectorAll('[data-coll]').forEach(n => {
    n.onclick = () => {
      const t = n.dataset.coll;
      state.panel = state.panel === t ? null : t;
      state.filter = '';
      render();
      if (state.panel) { const f = document.getElementById('tpFilter'); if (f) f.focus(); }
    };
  });
  el.querySelector('#settingsBtn').onclick = (e) => {
    e.stopPropagation();
    state.settingsPopOpen = !state.settingsPopOpen;
    render();
  };
  el.querySelectorAll('[data-set]').forEach(n => {
    n.onclick = (e) => { e.stopPropagation(); openSettings(n.dataset.set); };
  });
}

/* ============ type panel ============ */
function renderPanel() {
  const el = document.getElementById('typepanel');
  if (!state.panel) { el.className = 'typepanel closed'; el.innerHTML = ''; return; }
  el.className = 'typepanel';
  const t = state.panel, info = TYPE[t];
  const all = DOCS.filter(d => d.type === t);
  const q = state.filter.trim().toLowerCase();
  const match = d => !q || d.id.toLowerCase().includes(q) || d.title.toLowerCase().includes(q);
  const living = all.filter(d => LIVING[t].includes(d.status) && match(d));
  const dead = all.filter(d => !LIVING[t].includes(d.status) && match(d));
  const activeDoc = state.activeTab.startsWith('doc:') ? state.activeTab.slice(4) : null;
  const pinnedRows = living.filter(d => state.pinned.has(d.id));
  const restRows = living.filter(d => !state.pinned.has(d.id));

  const row = (d, pin) => `
    <div class="tp-row ${activeDoc === d.id ? 'active' : ''}" data-doc="${d.id}">
      ${pin ? '<span class="star">★</span>' : ''}
      <span class="id" style="color:${info.color}">${d.id}</span>
      <span class="ttl">${esc(d.title)}</span>
      <span class="st" style="color:${ST_COLOR[d.status]}${d.status==='done'?';opacity:.6':''}">${d.status}</span>
    </div>`;

  const deadLabel = t === 'wo' ? 'done' : 'superseded';
  let list = '';
  if (pinnedRows.length) list += `<div class="tp-group">Pinned</div>` + pinnedRows.map(d => row(d, true)).join('');
  list += (pinnedRows.length ? `<div class="tp-group">All</div>` : '') + restRows.map(d => row(d, false)).join('');
  if (dead.length) {
    list += state.showDead[t]
      ? `<div class="tp-more" data-dead>▾ hide ${deadLabel}</div>` + dead.map(d => row(d, false)).join('')
      : `<div class="tp-more" data-dead>▸ ${dead.length} ${deadLabel}</div>`;
  }
  if (!living.length && !dead.length) list = `<div class="tp-empty">No matches for “${esc(state.filter)}”.</div>`;

  el.innerHTML = `
    <div class="tp-head">
      <i style="background:${info.color}"></i>
      <span class="t">${info.label}</span>
      <span class="n">${all.length}</span>
      <button class="tp-close" title="Close panel">✕</button>
    </div>
    <div class="tp-filter"><input id="tpFilter" placeholder="Filter ${info.label.toLowerCase()}…" value="${esc(state.filter)}"></div>
    <div class="tp-list">${list}</div>`;

  el.querySelector('.tp-close').onclick = () => { state.panel = null; render(); };
  const filter = el.querySelector('#tpFilter');
  filter.oninput = () => {
    state.filter = filter.value;
    const pos = filter.selectionStart;
    renderPanel();
    const f2 = document.getElementById('tpFilter');
    f2.focus(); f2.setSelectionRange(pos, pos);
  };
  el.querySelectorAll('[data-doc]').forEach(n => {
    n.onclick = () => openDoc(n.dataset.doc);
    n.ondblclick = () => { openDoc(n.dataset.doc); pinTab('doc:' + n.dataset.doc); };
  });
  const dd = el.querySelector('[data-dead]');
  if (dd) dd.onclick = () => { state.showDead[t] = !state.showDead[t]; renderPanel(); };
}

/* ============ tab strip ============ */
function renderTabs() {
  const el = document.getElementById('tabstrip');
  el.innerHTML = state.tabs.map(t => {
    const label = t.kind === 'view'
      ? `<span class="tid" style="color:var(--muted)">${VIEWS[t.view].glyph}</span><span class="tttl">${VIEWS[t.view].label}</span>`
      : `<span class="tid" style="color:${TYPE[byId[t.id].type].color}">${t.id}</span><span class="tttl">${esc(shortTitle(byId[t.id].title))}</span>`;
    return `<div class="tab ${t.key === state.activeTab ? 'active' : ''} ${t.preview ? 'preview' : ''}" data-tab="${t.key}">
      ${label}<button class="x" data-close="${t.key}">✕</button></div>`;
  }).join('');
  el.querySelectorAll('[data-tab]').forEach(n => {
    n.onclick = (e) => { if (!e.target.dataset.close) { state.activeTab = n.dataset.tab; render(); } };
    n.ondblclick = () => pinTab(n.dataset.tab);
  });
  el.querySelectorAll('[data-close]').forEach(n => {
    n.onclick = (e) => { e.stopPropagation(); closeTab(n.dataset.close); };
  });
}
function shortTitle(t) {
  const cut = t.split(' — ')[0].split(' (')[0];
  return cut.length > 26 ? cut.slice(0, 25).trimEnd() + '…' : cut;
}

/* ============ views ============ */
function renderMain() {
  const vp = document.getElementById('viewport');
  const tab = state.tabs.find(t => t.key === state.activeTab);
  if (!tab) return;
  if (tab.kind === 'doc') vp.innerHTML = docView(tab.id);
  else if (tab.view === 'home') vp.innerHTML = homeView();
  else if (tab.view === 'board') vp.innerHTML = boardView();
  else if (tab.view === 'graph') vp.innerHTML = graphView();
  else if (tab.view === 'settings') vp.innerHTML = settingsView();
  wireMain(vp, tab);
}

function statusTag(status) {
  const c = ST_COLOR[status] || 'var(--muted)';
  return `<span class="tag" style="color:${c};background:color-mix(in srgb, ${c} 10%, transparent)">${status}</span>`;
}
function typeTag(type) {
  const c = TYPE[type].color;
  return `<span class="tag" style="color:${c};background:color-mix(in srgb, ${c} 10%, transparent)">${TYPE[type].crumb.replace(/s$/,'').replace('-',' ')}</span>`;
}

function docView(id) {
  const d = byId[id];
  const c = TYPE[d.type].color;
  const pinned = state.pinned.has(id);
  const warn = id === 'REQ-016'
    ? `<div style="display:flex;gap:9px;align-items:center;background:rgba(217,160,63,0.07);border:1px solid #3A3020;border-radius:8px;padding:10px 13px;margin-bottom:18px;font-size:12.5px;color:var(--warn)">
        <span>⚠</span><span style="font-family:var(--mono);font-size:10px">veri check</span>
        <span style="color:var(--body)">draft requirement has no linked work order</span></div>`
    : '';
  return `<div class="doc">
    <div class="crumb"><span style="color:${c}">${TYPE[d.type].crumb}</span><span>/</span><span style="color:${c}">${d.id}</span></div>
    <div class="doc-title-row">
      <h1>${esc(d.title)}</h1>
      <button class="pinbtn ${pinned ? 'pinned' : ''}" data-pin="${id}">${pinned ? '★ Pinned' : '☆ Pin'}</button>
    </div>
    ${warn}
    <div class="fm">
      <div class="fm-row"><span class="k">type</span><span class="v">${typeTag(d.type)}</span></div>
      <div class="fm-row"><span class="k">status</span><span class="v">${statusTag(d.status)}</span></div>
      <div class="fm-row"><span class="k">id</span><span class="v" style="font-family:var(--mono);font-size:11.5px;color:${c}">${d.id}</span></div>
    </div>
    <div class="doc-body">
      <h2>Summary</h2>
      <p class="${BLURBS[id] ? '' : 'placeholder'}">${BLURBS[id] || GENERIC[d.type]}</p>
    </div>
  </div>`;
}

function homeView() {
  const inflight = DOCS.filter(d => d.type === 'wo' && LIVING.wo.includes(d.status));
  const hrowDoc = (d, extra = '', time = '') => `
    <div class="hrow" data-open="${d.id}">
      <span class="id" style="color:${TYPE[d.type].color}">${d.id}</span>
      <span class="tx">${esc(shortTitle(d.title))}</span>${extra}
      ${time ? `<span class="tm">${time}</span>` : ''}
    </div>`;
  return `<div class="home">
    <h1>veri</h1>
    <div class="sub">${DOCS.length} documents · main @ c65bd00</div>
    <div class="grid2">
      <div class="hcard">
        <div class="hcard-head"><span class="t">Health</span><span class="m">1 issue</span></div>
        <div class="hrow" data-open="REQ-016">
          <span class="kindchip">unlinked</span>
          <span class="id" style="color:var(--req)">REQ-016</span>
          <span class="tx">draft requirement has no linked work order</span>
        </div>
      </div>
      <div class="hcard">
        <div class="hcard-head"><span class="t">In flight</span><span class="m">${inflight.length}</span></div>
        ${inflight.map(d => hrowDoc(d,
          (d.status === 'in-progress' ? '<span class="agentchip">⌁ agent</span>' : '') +
          `<span class="st" style="color:${ST_COLOR[d.status]}">${d.status}</span>`)).join('')}
      </div>
      <div class="hcard">
        <div class="hcard-head"><span class="t">Agent activity</span></div>
        <div class="hrow" data-open="WO-027"><span class="id" style="color:var(--wo)">WO-027</span><span class="tx">closing receipt filed — dialog flows verified</span><span class="tm">2d</span></div>
        <div class="hrow" data-open="DEC-034"><span class="id" style="color:var(--dec)">DEC-034</span><span class="tx">approved by Daniel</span><span class="tm">3d</span></div>
        <div class="hrow" data-open="WO-031"><span class="id" style="color:var(--wo)">WO-031</span><span class="tx">receipt filed — loop verified live</span><span class="tm">3d</span></div>
      </div>
      <div class="hcard">
        <div class="hcard-head"><span class="t">Recently changed</span></div>
        ${hrowDoc(byId['REQ-016'], '', '1d')}
        ${hrowDoc(byId['WO-027'], '', '2d')}
        ${hrowDoc(byId['DEC-034'], '', '3d')}
        ${hrowDoc(byId['WO-028'], '', '5d')}
      </div>
    </div>
  </div>`;
}

function boardView() {
  const cols = [
    { key: 'backlog', label: 'Backlog', dot: 'var(--muted)' },
    { key: 'in-progress', label: 'In progress', dot: 'var(--ember)' },
    { key: 'done', label: 'Done', dot: 'var(--ok)' },
  ];
  const wos = DOCS.filter(d => d.type === 'wo');
  return `<div class="board">
    <h1>Board</h1><div class="sub">${wos.length} work orders</div>
    <div class="cols">${cols.map(c => {
      const items = wos.filter(d => d.status === c.key);
      const shown = c.key === 'done' ? items.slice(0, 4) : items;
      return `<div>
        <div class="col-head"><span class="dot" style="background:${c.dot}"></span><span class="t">${c.label}</span><span class="n">${items.length}</span></div>
        ${shown.map(d => `<div class="wcard" data-open="${d.id}">
          <div class="top"><span class="id">${d.id}</span>${d.status === 'in-progress' ? '<span class="agentchip">⌁ agent</span>' : ''}</div>
          <div class="t">${esc(shortTitle(d.title))}</div>
          <div class="foot">1 linked REQ</div>
        </div>`).join('')}
        ${items.length > shown.length ? `<div class="col-more">+ ${items.length - shown.length} more</div>` : ''}
      </div>`;
    }).join('')}</div>
  </div>`;
}

function graphView() {
  const nodes = [
    { id: 'REQ-004', x: 30, y: 32, r: 11, c: 'var(--req)' },
    { id: 'REQ-011', x: 68, y: 24, r: 8, c: 'var(--req)' },
    { id: 'DEC-012', x: 46, y: 52, r: 9, c: 'var(--dec)' },
    { id: 'DEC-028', x: 80, y: 44, r: 7, c: 'var(--dec)' },
    { id: 'DEC-029', x: 88, y: 66, r: 6, c: 'var(--dec)' },
    { id: 'WO-028', x: 62, y: 60, r: 10, c: 'var(--wo)' },
    { id: 'WO-034', x: 74, y: 80, r: 6, c: 'var(--wo)' },
    { id: 'WO-014', x: 22, y: 62, r: 7, c: 'var(--wo)' },
    { id: 'SRC-005', x: 12, y: 44, r: 7, c: 'var(--src)' },
    { id: 'SRC-012', x: 46, y: 80, r: 6, c: 'var(--src)' },
  ];
  const edges = [[0,2],[0,7],[0,8],[1,5],[3,5],[4,5],[5,6],[2,7],[8,7],[9,5],[1,3]];
  return `<div class="graph">
    <div class="graph-head"><h1>Graph</h1>
      <div class="legend">
        <span><i style="background:var(--req)"></i>REQ</span>
        <span><i style="background:var(--dec)"></i>DEC</span>
        <span><i style="background:var(--wo)"></i>WO</span>
        <span><i style="background:var(--src)"></i>SRC</span>
      </div>
    </div>
    <div class="canvas">
      <svg style="position:absolute;inset:0;width:100%;height:100%" preserveAspectRatio="none" viewBox="0 0 100 100">
        ${edges.map(([a,b]) => `<line x1="${nodes[a].x}" y1="${nodes[a].y}" x2="${nodes[b].x}" y2="${nodes[b].y}" stroke="#26262C" stroke-width="0.18"/>`).join('')}
      </svg>
      ${nodes.map(n => `<div class="gnode" style="left:${n.x}%;top:${n.y}%" data-open="${n.id}">
        <b style="width:${n.r * 2}px;height:${n.r * 2}px;background:${n.c}"></b><span>${n.id}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function settingsView() {
  const s = state.settingsSection;
  const item = (key, glyph, label, soon) => `
    <div class="set-item ${s === key ? 'active' : ''}" data-setnav="${key}">
      <span class="glyph">${glyph}</span>${label}${soon ? '<span class="soon">soon</span>' : ''}
    </div>`;
  let body = '';
  if (s === 'templates') body = `
    <h1>Templates</h1>
    <p class="lede">Per-project document templates (DEC-023). New documents are generated from these; structure findings stay advisory (DEC-025).</p>
    <div class="scard">
      ${[['req','requirement.md','customized'],['dec','decision.md',''],['wo','work-order.md','customized'],['src','source.md','']].map(([t, f, note]) => `
        <div class="srow"><span class="sw" style="background:${TYPE[t].color}"></span>
          <span class="f">veri/templates/${f}</span>
          ${note ? `<span class="note">${note}</span>` : '<span class="note" style="color:var(--ghost)">default</span>'}
          <button class="act">Edit</button></div>`).join('')}
    </div>`;
  else if (s === 'agent') body = `
    <h1>Agent connection</h1>
    <p class="lede">The MCP server that gives coding agents access to this project’s context packages.</p>
    <div class="statuscard"><span class="dot"></span><span class="t">Serving on localhost</span><span class="m">mcp · :7423 · live</span></div>
    <div class="scard">
      <div class="kv"><span class="k">client</span><span class="v mono">claude-code · last pull 2h ago</span></div>
      <div class="kv"><span class="k">config</span><span class="v mono">.mcp.json · recognized entry (DEC-011)</span></div>
    </div>
    <div class="snippet"><span class="c"># agents connect with</span>
veri.get_context("WO-028")
<span class="c">mcp://localhost:7423 · live</span></div>`;
  else if (s === 'project') body = `
    <h1>Project settings</h1>
    <p class="lede">Identity and format of this knowledge base.</p>
    <div class="scard">
      <div class="kv"><span class="k">name</span><span class="v">veri</span></div>
      <div class="kv"><span class="k">path</span><span class="v mono">~/Projects/veri/veri</span></div>
      <div class="kv"><span class="k">format</span><span class="v mono">veri/format v1 (DEC-030)</span></div>
      <div class="kv"><span class="k">workflow</span><span class="v mono">veri/workflow.md · accepted</span></div>
    </div>`;
  else if (s === 'updates') body = `
    <h1>Updates</h1>
    <p class="lede">The app updates itself from GitHub Releases of the public veri repo (DEC-029).</p>
    <div class="scard">
      <div class="kv"><span class="k">version</span><span class="v mono">0.9.2</span></div>
      <div class="kv"><span class="k">channel</span><span class="v mono">latest</span></div>
      <div class="kv"><span class="k">status</span><span class="v" style="color:var(--ok)">Up to date · checked 1h ago</span></div>
    </div>`;
  return `<div class="settings">
    <div class="set-nav">
      <div class="set-label">Project</div>
      ${item('templates','⌧','Templates')}
      ${item('agent','⌁','Agent connection')}
      ${item('project','▣','Project settings')}
      <div class="set-gap"></div>
      <div class="set-label">Application</div>
      ${item('updates','↻','Updates')}
      ${item('appearance','◐','Appearance', true)}
    </div>
    <div class="set-body"><div class="set-body-inner">${body}</div></div>
  </div>`;
}

function wireMain(vp, tab) {
  vp.querySelectorAll('[data-open]').forEach(n => { n.onclick = () => openDoc(n.dataset.open); });
  vp.querySelectorAll('[data-pin]').forEach(n => {
    n.onclick = () => {
      const id = n.dataset.pin;
      state.pinned.has(id) ? state.pinned.delete(id) : state.pinned.add(id);
      render();
    };
  });
  vp.querySelectorAll('[data-setnav]').forEach(n => {
    n.onclick = () => {
      if (n.dataset.setnav === 'appearance') return;
      state.settingsSection = n.dataset.setnav;
      renderMain();
    };
  });
}

/* ============ global ============ */
document.getElementById('healthChip').onclick = (e) => {
  e.stopPropagation();
  document.getElementById('healthPop').classList.toggle('open');
};
document.getElementById('healthPop').onclick = (e) => e.stopPropagation();
document.querySelectorAll('#healthPop [data-open]').forEach(n => {
  n.onclick = (e) => { e.stopPropagation(); document.getElementById('healthPop').classList.remove('open'); openDoc(n.dataset.open); };
});
document.addEventListener('click', () => {
  document.getElementById('healthPop').classList.remove('open');
  if (state.settingsPopOpen) { state.settingsPopOpen = false; renderSidebar(); }
});

function render() { renderSidebar(); renderPanel(); renderTabs(); renderMain(); }
render();
</script>
