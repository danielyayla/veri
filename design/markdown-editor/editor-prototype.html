<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veri — Markdown Editor prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#0F0F11; color:#C9C6CF;
    font:14.5px/1.65 "Source Sans 3",-apple-system,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .mono { font-family:"JetBrains Mono",monospace; }

  /* ---------- shell ---------- */
  #app { display:flex; flex-direction:column; height:100vh; }
  .topbar {
    height:44px; flex:none; background:#131316; border-bottom:1px solid #1E1E24;
    display:flex; align-items:center; padding:0 14px; gap:10px;
  }
  .logo { width:18px; height:18px; background:#E8703A; border-radius:4px; color:#0F0F11;
    font:700 12px/18px "JetBrains Mono",monospace; text-align:center; }
  .wordmark { font-size:13px; font-weight:600; color:#E7E4DE; }
  .tb-sep { color:#4A4852; }
  .tb-proj { font-family:"JetBrains Mono",monospace; font-size:12px; color:#A09DA6; }
  .tb-search {
    margin-left:auto; margin-right:auto; width:340px; height:26px; border:1px solid #26262C;
    border-radius:6px; background:#0F0F11; display:flex; align-items:center; padding:0 8px;
    color:#6E6B76; font-size:12px; gap:8px;
  }
  .kbd { font-family:"JetBrains Mono",monospace; font-size:10px; border:1px solid #26262C;
    border-radius:4px; padding:1px 5px; color:#8B8893; background:#131316; }
  .tb-chip { font-family:"JetBrains Mono",monospace; font-size:11px; color:#A09DA6;
    border:1px solid #26262C; border-radius:6px; padding:3px 9px; }
  .tb-chip.ok { color:#7FAF8A; }

  .body { flex:1; display:flex; min-height:0; }

  /* ---------- sidebar ---------- */
  .sidebar { width:250px; flex:none; background:#131316; border-right:1px solid #1E1E24;
    display:flex; flex-direction:column; padding:10px 0 0; }
  .nav { padding:0 8px 8px; border-bottom:1px solid #1E1E24; }
  .nav-row { height:28px; display:flex; align-items:center; gap:9px; padding:0 9px;
    border-radius:6px; font-size:13px; color:#A09DA6; cursor:pointer; }
  .nav-row:hover { background:#1B1B20; }
  .nav-glyph { width:14px; text-align:center; color:#6E6B76; }
  .tree { flex:1; overflow-y:auto; padding:10px 8px; }
  .tree-group { margin-bottom:14px; }
  .tree-head { display:flex; align-items:center; gap:7px; padding:0 9px 4px;
    font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em;
    color:#6E6B76; text-transform:uppercase; }
  .tree-head .sw { width:7px; height:7px; border-radius:2px; flex:none; }
  .tree-head .cnt { color:#4A4852; }
  .tree-head .add { margin-left:auto; color:#55525E; cursor:pointer; font-size:14px;
    line-height:1; padding:1px 4px; border-radius:4px; visibility:hidden; }
  .tree-group:hover .add { visibility:visible; }
  .tree-head .add:hover { color:#E7E4DE; background:#26262C; }
  .tree-row { height:26px; display:flex; align-items:center; gap:8px; padding:0 9px;
    border-radius:6px; cursor:pointer; overflow:hidden; }
  .tree-row:hover { background:#1B1B20; }
  .tree-row.active { background:rgba(232,112,58,0.09); }
  .tree-row .tid { font-family:"JetBrains Mono",monospace; font-size:10.5px; flex:none; }
  .tree-row .tt { font-size:12.5px; color:#A09DA6; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .tree-row.active .tt { color:#E7E4DE; }
  .side-foot { flex:none; border-top:1px solid #1E1E24; padding:8px 17px;
    font-family:"JetBrains Mono",monospace; font-size:10px; color:#6E6B76;
    display:flex; align-items:center; gap:7px; }
  .pulse { width:6px; height:6px; border-radius:50%; background:#7FAF8A;
    animation:pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ---------- tab strip ---------- */
  .editor-area { flex:1; display:flex; flex-direction:column; min-width:0; }
  .tabstrip { height:37px; flex:none; background:#131316; display:flex; overflow-x:auto; }
  .tabstrip .filler { flex:1; border-bottom:1px solid #1E1E24; }
  .tab { display:flex; align-items:center; gap:8px; padding:0 8px 0 13px; max-width:220px;
    border-right:1px solid #1A1A1F; border-bottom:1px solid #1E1E24; cursor:pointer;
    position:relative; flex:none; }
  .tab.active { background:#0F0F11; border-bottom-color:transparent; }
  .tab.active::before { content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:#E8703A; }
  .tab .tid { font-family:"JetBrains Mono",monospace; font-size:10px; white-space:nowrap; flex:none; }
  .tab .tt { font-size:12.5px; color:#8B8893; max-width:130px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .tab.active .tt { color:#E7E4DE; }
  .tab .x { width:16px; height:16px; border-radius:4px; text-align:center;
    line-height:15px; font-size:13px; color:#3F3D47; flex:none; }
  .tab.active .x { color:#55525E; }
  .tab .x:hover { background:#26262C; color:#E7E4DE; }
  .tab .x .dot { display:none; }
  .tab.dirty .x .glyph { display:none; }
  .tab.dirty .x .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
    background:#E8703A; vertical-align:middle; margin-top:-3px; }
  .tab.dirty .x:hover .glyph { display:inline; }
  .tab.dirty .x:hover .dot { display:none; }

  /* ---------- doc view ---------- */
  .docwrap { flex:1; display:flex; min-height:0; }
  .doccol { flex:1; display:flex; flex-direction:column; min-width:0; }
  .crumbrow { flex:none; max-width:740px; width:100%; margin:0 auto;
    padding:22px 40px 0; display:flex; align-items:center; gap:10px; }
  .crumb { font-family:"JetBrains Mono",monospace; font-size:11px; color:#6E6B76; }
  .crumb .cid { font-weight:500; }
  .modetoggle { margin-left:auto; display:flex; border:1px solid #26262C; border-radius:6px;
    overflow:hidden; }
  .modetoggle span { font-family:"JetBrains Mono",monospace; font-size:11px; padding:3px 10px;
    color:#8B8893; cursor:pointer; }
  .modetoggle span.on { background:rgba(232,112,58,0.1); color:#F0A87E; }
  .scroller { flex:1; overflow-y:auto; min-height:0; }
  .col { max-width:740px; margin:0 auto; padding:14px 40px 60px; }

  /* banners */
  .banner { display:flex; align-items:center; gap:10px; margin:0 0 14px;
    background:rgba(217,160,63,0.08); border:1px solid #3A3020; border-radius:8px;
    padding:9px 12px; font-size:12px; color:#D9A03F; }
  .banner .bb { margin-left:auto; display:flex; gap:8px; }
  .banner button { font:500 11px "JetBrains Mono",monospace; padding:4px 10px;
    border-radius:6px; border:1px solid #3A3020; background:transparent; color:#D9A03F;
    cursor:pointer; }
  .banner button:hover { background:rgba(217,160,63,0.12); }

  /* ---------- read mode ---------- */
  .rtitle { font-size:24px; font-weight:600; color:#E7E4DE; margin:2px 0 16px; }
  .props { border:1px solid #1F1F24; background:#151519; border-radius:9px;
    padding:6px 14px; margin-bottom:22px; }
  .prow { display:flex; align-items:center; min-height:28px; }
  .prow .pk { width:110px; flex:none; font-family:"JetBrains Mono",monospace;
    font-size:11px; color:#6E6B76; }
  .prow .pv { font-size:13px; color:#C9C6CF; }
  .chip { display:inline-block; font-family:"JetBrains Mono",monospace; font-size:10.5px;
    border-radius:4px; padding:1px 7px; }
  .rbody h2 { font-size:15px; font-weight:600; color:#E7E4DE; margin:20px 0 8px; }
  .rbody p { margin:0 0 10px; }
  .rbody ul { margin:0 0 10px 20px; }
  .cbx { list-style:none; margin-left:0 !important; }
  .cbx li { display:flex; gap:9px; align-items:baseline; padding:3px 0; font-size:15px; }
  .cbx .box { width:14px; height:14px; border:1px solid #26262C; border-radius:4px;
    flex:none; position:relative; top:2px; }
  .cbx li.done .box { background:#7FAF8A; border-color:#7FAF8A; color:#0F0F11;
    font-size:10px; line-height:13px; text-align:center; }
  .cbx li.done { color:#6E6B76; }

  /* ---------- edit mode (CM6 stand-in) ---------- */
  .cm { outline:none; white-space:pre-wrap; word-wrap:break-word; caret-color:#E8703A; }
  .cm ::selection { background:rgba(232,112,58,0.18); }
  .cm .ln { min-height:1.65em; padding:0 4px; border-radius:3px; }
  .cm .ln.hl { background:rgba(19,19,22,0.6); }
  .cm .ln.flash { animation:flash .3s ease-out; }
  @keyframes flash { 0%{background:rgba(217,160,63,0.15)} 100%{background:transparent} }
  .cm .fm { font-family:"JetBrains Mono",monospace; font-size:12px; line-height:1.7;
    border-left:2px solid #1E1E24; padding-left:10px; }
  .cm .fm .k { color:#8B8893; } .cm .fm .v { color:#C9C6CF; }
  .cm .fm.guard .k, .cm .fm.guard .v { color:#6E6B76; }
  .cm .fence { color:#55525E; }
  .cm .mark { color:#55525E; }
  .cm .hd { color:#E7E4DE; font-weight:600; }
  .cm .wl-req { color:#7EA6C4; } .cm .wl-dec { color:#CFA83D; }
  .cm .wl-wo { color:#E8703A; } .cm .wl-src { color:#908BA8; }
  .cm .wl-bad { color:#D9A03F; text-decoration:underline dashed; text-underline-offset:3px; }
  .cm .code { font-family:"JetBrains Mono",monospace; font-size:13px; color:#A09DA6; }

  .statusrow { flex:none; height:28px; max-width:740px; width:100%; margin:0 auto;
    border-top:1px solid #1E1E24; display:flex; align-items:center; padding:0 40px;
    font-family:"JetBrains Mono",monospace; font-size:10.5px; color:#6E6B76; gap:8px; }
  .statusrow .dot { width:6px; height:6px; border-radius:50%; background:#E8703A; }
  .statusrow .note.warn { color:#D9A03F; }
  .statusrow .hints { margin-left:auto; color:#55525E; font-size:10px; }
  .fade { transition:opacity 1.5s; opacity:0; }

  /* ---------- connections panel ---------- */
  .conns { width:300px; flex:none; border-left:1px solid #1E1E24; background:#131316;
    overflow-y:auto; padding:22px 16px; }
  .conns h4 { font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:#6E6B76; margin:0 0 8px; }
  .ccard { border:1px solid #1F1F24; background:#151519; border-radius:8px;
    padding:9px 11px; margin-bottom:8px; cursor:default; }
  .ccard .ch { display:flex; align-items:baseline; gap:8px; }
  .ccard .cid { font-family:"JetBrains Mono",monospace; font-size:11px; }
  .ccard .ctp { margin-left:auto; font-size:11px; color:#55525E; }
  .ccard .ct { font-size:12.5px; color:#C9C6CF; margin-top:2px; }
  .ccard .cr { font-family:"JetBrains Mono",monospace; font-size:10px; color:#6E6B76;
    margin-top:3px; }

  /* ---------- popovers ---------- */
  .pop { position:fixed; background:#1A1A1F; border:1px solid #26262C; border-radius:8px;
    box-shadow:0 12px 32px rgba(0,0,0,.5); z-index:50; }
  .ac { min-width:260px; max-height:230px; overflow-y:auto; padding:4px; }
  .ac-row { display:flex; align-items:baseline; gap:9px; padding:5px 9px; border-radius:6px;
    cursor:pointer; }
  .ac-row .aid { font-family:"JetBrains Mono",monospace; font-size:11px; flex:none; }
  .ac-row .at { font-size:12.5px; color:#C9C6CF; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .ac-row.sel { background:#1B1B20; }

  .newpop { width:320px; padding:14px; }
  .newpop h5 { font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:#6E6B76; margin:0 0 10px; }
  .segs { display:flex; border:1px solid #26262C; border-radius:6px; overflow:hidden;
    margin-bottom:10px; }
  .segs span { flex:1; text-align:center; font-family:"JetBrains Mono",monospace;
    font-size:11px; padding:5px 0; color:#8B8893; cursor:pointer; }
  .newpop input { width:100%; height:34px; background:#0F0F11; border:1px solid #26262C;
    border-radius:6px; color:#E7E4DE; font:13px "Source Sans 3",sans-serif; padding:0 10px;
    outline:none; margin-bottom:10px; }
  .newpop input:focus { border-color:#8A4A2C; }
  .btn { font:500 12px "Source Sans 3",sans-serif; border:none; border-radius:6px;
    padding:7px 14px; cursor:pointer; }
  .btn.primary { background:#E8703A; color:#16110D; }
  .btn.primary:hover { background:#F0A87E; }
  .btn.ghost { background:transparent; color:#8B8893; }
  .btn.ghost:hover { color:#E7E4DE; }

  .closepop { padding:12px 14px; width:240px; }
  .closepop p { font-size:12.5px; color:#C9C6CF; margin-bottom:10px; }
  .closepop .row { display:flex; gap:8px; justify-content:flex-end; }

  /* prototype controls */
  .proto { position:fixed; right:14px; bottom:14px; z-index:60; display:flex; gap:8px; }
  .proto button { font:500 10.5px "JetBrains Mono",monospace; color:#8B8893;
    background:#1A1A1F; border:1px solid #26262C; border-radius:6px; padding:5px 10px;
    cursor:pointer; }
  .proto button:hover { color:#E7E4DE; border-color:#2E2E36; }
</style>
</head>
<body>
<div id="app"></div>
<div class="proto">
  <button onclick="simulateExternal()">⚡ simulate external edit</button>
</div>
<script>
/* ================= fixture data (illustrative "skiff" invoicing demo) ============= */
const TYPE = {
  requirement:{color:'#7EA6C4', prefix:'REQ', group:'REQUIREMENTS', crumb:'Requirements', status:'draft'},
  decision:   {color:'#CFA83D', prefix:'DEC', group:'DECISIONS', crumb:'Decisions', status:'proposed'},
  'work-order':{color:'#E8703A', prefix:'WO', group:'WORK ORDERS', crumb:'Work Orders', status:'backlog'},
  source:     {color:'#908BA8', prefix:'SRC', group:'SOURCES', crumb:'Sources', status:'imported'},
};
const typeOf = id => id.startsWith('REQ') ? 'requirement' : id.startsWith('DEC') ? 'decision'
  : id.startsWith('WO') ? 'work-order' : 'source';
const TODAY = '2026-08-12';

const DOCS = {};
function addDoc(id, title, status, body) {
  DOCS[id] = { id, title, status, text:
`---
id: ${id}
type: ${typeOf(id)}
title: ${title}
status: ${status}${status==='accepted'||status==='active' ? '\napproved: 2026-08-02' : ''}
created: 2026-07-28
updated: 2026-08-05
links:
  - id: DEC-004
    rel: constrained-by
---

${body}` };
}
addDoc('REQ-002','PDF export with templates','accepted',
`Invoices export to PDF using per-client templates. Rendering is
pixel-identical to the on-screen preview per [[DEC-004]], and template
variables come from the schema in [[SRC-002]].

## Acceptance criteria

- [x] Export renders through the shared print pipeline
- [ ] Custom templates round-trip through [[WO-007]]
- [ ] A missing template falls back to the default with a warning`);
addDoc('REQ-003','Recurring invoices','draft',
`Clients can schedule invoices on a monthly or quarterly cadence.

## Acceptance criteria

- [ ] Schedules survive restarts
- [ ] Skipped runs surface in the activity feed`);
addDoc('DEC-004','Chromium print pipeline for PDF export','active',
`## Choice

PDF export renders through the app's own Chromium print pipeline.

## Rejected alternatives

- **wkhtmltopdf** — unmaintained, diverges from preview rendering.
- **Server-side render farm** — violates the offline requirement.`);
addDoc('WO-007','PDF export MVP','in-progress',
`## Summary

Implement [[REQ-002]] behind the print pipeline of [[DEC-004]].`);
addDoc('SRC-002','Billing workflow interviews','imported',
`Notes from six invoicing-workflow interviews, informing [[REQ-002]].`);

/* ================= state ================= */
const state = {
  tabs: [{id:'REQ-002'}],
  active: 'REQ-002',
  // per-doc tab state
  t: { 'REQ-002': { mode:'read', dirty:false, buffer:null, conflict:'none' } },
  status: '', statusWarn:false, statusTimer:null,
  ac: null,          // {query, sel, rect}
  newPop: null,      // {type, anchorRect}
  closePop: null,    // tab id
};
const tabState = id => state.t[id] || (state.t[id] = {mode:'read',dirty:false,buffer:null,conflict:'none'});

/* ================= helpers ================= */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function frontmatterRange(lines){
  if (lines[0] !== '---') return [-1,-1];
  for (let i=1;i<lines.length;i++) if (lines[i]==='---') return [0,i];
  return [0,-1];
}
function isGuarded(line, idx, fm){
  const inFm = fm[0]===0 && (fm[1]===-1 ? idx>0 : idx>fm[0] && idx<fm[1]);
  return inFm && /^(id|approved):/.test(line);
}
function wikiCls(id){
  if (!DOCS[id]) return 'wl-bad';
  return {requirement:'wl-req',decision:'wl-dec','work-order':'wl-wo',source:'wl-src'}[typeOf(id)];
}
function renderLineHtml(line, idx, fm){
  const inFm = fm[0]===0 && (fm[1]===-1 ? idx>0 : idx>fm[0] && idx<fm[1]);
  if (line==='---' && (idx===fm[0]||idx===fm[1]))
    return `<div class="ln fm"><span class="fence">---</span></div>`;
  if (inFm){
    const g = isGuarded(line, idx, fm) ? ' guard' : '';
    const m = line.match(/^(\s*-?\s*[\w][\w-]*:)(.*)$/);
    const inner = m ? `<span class="k">${esc(m[1])}</span><span class="v">${esc(m[2])}</span>`
                    : `<span class="v">${esc(line)||'<br>'}</span>`;
    return `<div class="ln fm${g}">${inner}</div>`;
  }
  if (line==='') return `<div class="ln"><br></div>`;
  let html;
  const h = line.match(/^(#{1,4}) (.*)$/);
  if (h) html = `<span class="mark">${h[1]} </span><span class="hd">${esc(h[2])}</span>`;
  else {
    html = esc(line)
      .replace(/^(- \[[ x]\] |[-*] |&gt; )/, '<span class="mark">$1</span>')
      .replace(/\*\*([^*]+)\*\*/g, '<span class="mark">**</span><span class="hd">$1</span><span class="mark">**</span>')
      .replace(/`([^`]+)`/g, '<span class="mark">`</span><span class="code">$1</span><span class="mark">`</span>');
  }
  html = html.replace(/\[\[([A-Z]{2,3}-\d{3})\]\]/g,
    (_,id)=>`<span class="mark">[[</span><span class="${wikiCls(id)}" data-wl="${id}">${id}</span><span class="mark">]]</span>`);
  return `<div class="ln">${html||'<br>'}</div>`;
}

/* caret offset within the .cm container, as absolute char offset */
function getCaret(cm){
  const sel = getSelection();
  if (!sel.rangeCount || !cm.contains(sel.anchorNode)) return null;
  const r = sel.getRangeAt(0).cloneRange();
  r.selectNodeContents(cm); r.setEnd(sel.anchorNode, sel.anchorOffset);
  // innerText-style length: count newlines between line divs
  const div = document.createElement('div');
  div.append(r.cloneContents());
  return textOf(div).length;
}
function textOf(container){
  const lines = [...container.querySelectorAll('.ln')];
  if (!lines.length) return container.textContent;
  return lines.map(l=>l.textContent).join('\n');
}
function setCaret(cm, offset){
  const lines = [...cm.querySelectorAll('.ln')];
  let rem = offset;
  for (const ln of lines){
    const len = ln.textContent.length;
    if (rem <= len){
      const walker = document.createTreeWalker(ln, NodeFilter.SHOW_TEXT);
      let node, o = rem;
      while ((node = walker.nextNode())){
        if (o <= node.length){
          const sel = getSelection(), r = document.createRange();
          r.setStart(node, o); r.collapse(true);
          sel.removeAllRanges(); sel.addRange(r);
          return;
        }
        o -= node.length;
      }
      const sel = getSelection(), r = document.createRange();
      r.selectNodeContents(ln); r.collapse(false);
      sel.removeAllRanges(); sel.addRange(r);
      return;
    }
    rem -= len + 1;
  }
}
function caretLineIndex(cm){
  const sel = getSelection();
  if (!sel.rangeCount) return -1;
  let n = sel.anchorNode;
  while (n && n !== cm && !(n.classList && n.classList.contains('ln'))) n = n.parentNode;
  return n && n !== cm ? [...cm.querySelectorAll('.ln')].indexOf(n) : -1;
}

/* ================= status row ================= */
function setStatus(msg, warn=false, sticky=false){
  state.status = msg; state.statusWarn = warn;
  const el = document.getElementById('statusNote');
  if (el){ el.textContent = msg; el.classList.toggle('warn', warn); el.classList.remove('fade'); }
  clearTimeout(state.statusTimer);
  if (!sticky) state.statusTimer = setTimeout(()=>{
    const e = document.getElementById('statusNote');
    if (e){ e.classList.add('fade'); }
    state.status='';
  }, msg==='saved' ? 1500 : 3000);
}

/* ================= rendering ================= */
function render(){
  const app = document.getElementById('app');
  const doc = DOCS[state.active];
  const ts = tabState(state.active);
  app.innerHTML = `
    ${topbar()}
    <div class="body">
      ${sidebar()}
      <div class="editor-area">
        ${tabstrip()}
        <div class="docwrap">
          <div class="doccol">
            ${crumbRow(doc, ts)}
            <div class="scroller"><div class="col" id="col">
              ${ts.conflict!=='none' ? conflictBanner(ts) : ''}
              ${ts.mode==='read' ? readPane(doc, ts) : editPane(doc, ts)}
            </div></div>
            ${ts.mode==='edit' ? statusRow(ts) : ''}
          </div>
          ${connsPanel(doc)}
        </div>
      </div>
    </div>`;
  wire();
}
function topbar(){
  return `<div class="topbar">
    <div class="logo mono">v</div><span class="wordmark">Veri</span>
    <span class="tb-sep">/</span><span class="tb-proj mono">skiff</span>
    <div class="tb-search">Search docs… <span class="kbd" style="margin-left:auto">⌘K</span></div>
    <span class="tb-chip mono ok">veri check · ok</span>
    <span class="tb-chip mono">⎇ main · clean</span>
  </div>`;
}
function sidebar(){
  const groups = {};
  Object.values(DOCS).forEach(d=>{ (groups[typeOf(d.id)] ||= []).push(d); });
  return `<div class="sidebar">
    <div class="nav">
      ${['≡ Documents','▤ Board','◉ Graph','§ Decisions'].map(n=>{
        const [g,...w]=n.split(' ');
        return `<div class="nav-row"><span class="nav-glyph">${g}</span>${w.join(' ')}</div>`;}).join('')}
    </div>
    <div class="tree">
      ${Object.entries(groups).map(([t,ds])=>`
        <div class="tree-group">
          <div class="tree-head"><span class="sw" style="background:${TYPE[t].color}"></span>
            ${TYPE[t].group} <span class="cnt">${ds.length}</span>
            <span class="add" data-newtype="${t}" title="New ${t}">+</span></div>
          ${ds.map(d=>`
            <div class="tree-row ${d.id===state.active?'active':''}" data-open="${d.id}">
              <span class="tid" style="color:${TYPE[typeOf(d.id)].color}">${d.id}</span>
              <span class="tt">${esc(d.title)}</span>
            </div>`).join('')}
        </div>`).join('')}
    </div>
    <div class="side-foot"><span class="pulse"></span> mcp · serving on :7423</div>
  </div>`;
}
function tabstrip(){
  return `<div class="tabstrip">
    ${state.tabs.map(t=>{
      const d = DOCS[t.id], ts = tabState(t.id);
      return `<div class="tab ${t.id===state.active?'active':''} ${ts.dirty?'dirty':''}" data-tab="${t.id}"
        title="${d.id} — ${esc(d.title)}">
        <span class="tid" style="color:${TYPE[typeOf(d.id)].color}">${d.id}</span>
        <span class="tt">${esc(d.title)}</span>
        <span class="x" data-close="${t.id}"><span class="glyph">×</span><span class="dot"></span></span>
      </div>`;}).join('')}
    <div class="filler"></div>
  </div>`;
}
function crumbRow(doc, ts){
  const t = typeOf(doc.id);
  return `<div class="crumbrow">
    <span class="crumb">${TYPE[t].crumb} / <span class="cid" style="color:${TYPE[t].color}">${doc.id}</span></span>
    <div class="modetoggle" title="⌘E">
      <span class="${ts.mode==='read'?'on':''}" data-mode="read">read</span>
      <span class="${ts.mode==='edit'?'on':''}" data-mode="edit">edit</span>
    </div>
  </div>`;
}
function conflictBanner(ts){
  if (ts.conflict==='disk-changed') return `<div class="banner">⚠ changed on disk while you were editing
    <span class="bb"><button data-conf="reload">Reload</button><button data-conf="keep">Keep mine</button></span></div>`;
  if (ts.conflict==='deleted') return `<div class="banner">⚠ file was deleted
    <span class="bb"><button data-conf="restore">Restore</button><button data-conf="closetab">Close tab</button></span></div>`;
  return '';
}
function readPane(doc, ts){
  const lines = doc.text.split('\n');
  const fm = frontmatterRange(lines);
  const fmLines = fm[1]>0 ? lines.slice(1, fm[1]) : [];
  const body = fm[1]>0 ? lines.slice(fm[1]+1).join('\n') : doc.text;
  const t = typeOf(doc.id);
  const props = fmLines.filter(l=>/^[\w-]+:/.test(l)).map(l=>{
    const [k,...r] = l.split(':'); const v = r.join(':').trim();
    let pv = esc(v);
    if (k==='type') pv = `<span class="chip" style="color:${TYPE[t].color};background:${tint(TYPE[t].color)}">${v}</span>`;
    if (k==='status'){ const c = statusColor(v); pv = `<span class="chip" style="color:${c};background:${tint(c)}">${v}</span>`; }
    return `<div class="prow"><span class="pk">${k}</span><span class="pv">${pv}</span></div>`;
  }).join('');
  let bhtml = '', para = [];
  const flush = ()=>{ if (para.length){ bhtml += `<p>${inline(para.join(' '))}</p>`; para=[]; } };
  for (const raw of body.split('\n')){
    const h = raw.match(/^## (.*)$/);
    if (h){ flush(); bhtml += `<h2>${esc(h[1])}</h2>`; continue; }
    const cb = raw.match(/^- \[([ x])\] (.*)$/);
    if (cb){
      flush();
      bhtml += `<ul class="cbx"><li class="${cb[1]==='x'?'done':''}"><span class="box">${cb[1]==='x'?'✓':''}</span><span>${inline(cb[2])}</span></li></ul>`;
      continue;
    }
    if (raw.startsWith('- ')){ flush(); bhtml += `<ul><li>${inline(raw.slice(2))}</li></ul>`; continue; }
    if (raw.startsWith('> ')){ flush(); bhtml += `<p style="color:#8B8893;border-left:2px solid #26262C;padding-left:12px">${inline(raw.slice(2))}</p>`; continue; }
    if (raw.trim()===''){ flush(); continue; }
    para.push(raw);
  }
  flush();
  return `
    ${ts.dirty ? `<div class="banner">⚠ viewing saved version — unsaved edits in edit mode</div>` : ''}
    <div class="rtitle">${esc(doc.title)}</div>
    <div class="props">${props}</div>
    <div class="rbody">${bhtml}</div>`;
}
function inline(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<strong style="color:#E7E4DE">$1</strong>')
    .replace(/`([^`]+)`/g,'<code class="mono" style="font-size:13px;color:#A09DA6">$1</code>')
    .replace(/\[\[([A-Z]{2,3}-\d{3})\]\]/g,(_,id)=>{
      const known = !!DOCS[id];
      const c = known ? TYPE[typeOf(id)].color : '#D9A03F';
      const extra = known ? '' : ';border-bottom:1px dashed #D9A03F';
      return `<span class="chip" data-wl="${id}" style="color:${c};background:${tint(c)};cursor:pointer${extra}" title="${known?id:'unresolved: '+id}">${id}</span>`;});
}
function editPane(doc, ts){
  const text = ts.buffer ?? doc.text;
  const lines = text.split('\n');
  const fm = frontmatterRange(lines);
  return `<div class="cm" id="cm" contenteditable="true" spellcheck="false">${
    lines.map((l,i)=>renderLineHtml(l,i,fm)).join('')}</div>`;
}
function statusRow(ts){
  return `<div class="statusrow">
    ${ts.dirty ? '<span class="dot"></span>' : ''}
    <span class="note ${state.statusWarn?'warn':''}" id="statusNote">${state.status || (ts.dirty?'unsaved changes':'')}</span>
    <span class="hints">⌘S save · ⌘E read</span>
  </div>`;
}
function connsPanel(doc){
  const out = [...doc.text.matchAll(/\[\[([A-Z]{2,3}-\d{3})\]\]/g)].map(m=>m[1])
    .filter((v,i,a)=>a.indexOf(v)===i && DOCS[v]);
  const inbound = Object.values(DOCS).filter(d=>d.id!==doc.id && d.text.includes(`[[${doc.id}]]`));
  const card = d => `<div class="ccard">
      <div class="ch"><span class="cid" style="color:${TYPE[typeOf(d.id)].color}">${d.id}</span>
      <span class="ctp">${typeOf(d.id).replace('-',' ')}</span></div>
      <div class="ct">${esc(d.title)}</div></div>`;
  return `<div class="conns">
    <h4>Outbound · links to <span style="color:#4A4852">${out.length}</span></h4>
    ${out.map(id=>card(DOCS[id])).join('') || '<div class="ccard"><div class="ct" style="color:#55525E">none</div></div>'}
    <h4 style="margin-top:18px">Inbound · linked from <span style="color:#4A4852">${inbound.length}</span></h4>
    ${inbound.map(card).join('') || '<div class="ccard"><div class="ct" style="color:#55525E">none</div></div>'}
  </div>`;
}
function tint(hex,a=0.1){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function statusColor(s){
  return {accepted:'#7FAF8A',active:'#7FAF8A',done:'#7FAF8A',draft:'#D9A03F',proposed:'#D9A03F',
    'in-progress':'#E8703A',imported:'#908BA8',backlog:'#A09DA6'}[s] || '#A09DA6';
}

/* ================= wiring ================= */
function wire(){
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openDoc(el.dataset.open));
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=e=>{
    if (e.target.closest('[data-close]')) return;
    state.active = el.dataset.tab; render();
  });
  document.querySelectorAll('[data-close]').forEach(el=>el.onclick=e=>{
    e.stopPropagation(); requestClose(el.dataset.close, el.getBoundingClientRect());
  });
  document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>setMode(el.dataset.mode));
  document.querySelectorAll('[data-newtype]').forEach(el=>el.onclick=e=>{
    e.stopPropagation(); openNewPop(el.dataset.newtype, el.getBoundingClientRect());
  });
  document.querySelectorAll('[data-conf]').forEach(el=>el.onclick=()=>resolveConflict(el.dataset.conf));
  document.querySelectorAll('.rbody [data-wl], .chip[data-wl]').forEach(el=>el.onclick=()=>{
    if (DOCS[el.dataset.wl]) openDoc(el.dataset.wl);
  });
  const cm = document.getElementById('cm');
  if (cm) wireEditor(cm);
}
function openDoc(id){
  if (!state.tabs.find(t=>t.id===id)){
    const i = state.tabs.findIndex(t=>t.id===state.active);
    state.tabs.splice(i+1,0,{id});
  }
  state.active = id; render();
}
function setMode(mode){
  tabState(state.active).mode = mode; render();
  if (mode==='edit'){
    const cm = document.getElementById('cm');
    if (cm){ cm.focus(); setCaret(cm, 0); }
  }
}
function requestClose(id, rect){
  const ts = tabState(id);
  if (ts.dirty){ state.closePop = {id, rect}; renderClosePop(); return; }
  closeTab(id);
}
function closeTab(id){
  const i = state.tabs.findIndex(t=>t.id===id);
  state.tabs.splice(i,1);
  delete state.t[id];
  if (state.active===id)
    state.active = state.tabs[i]?.id ?? state.tabs[i-1]?.id ?? state.tabs[0]?.id ?? null;
  if (!state.active && state.tabs.length===0){ state.tabs=[{id:'REQ-002'}]; state.active='REQ-002'; }
  render();
}

/* ---------- editor behavior ---------- */
function wireEditor(cm){
  cm.addEventListener('beforeinput', e=>{
    const idx = caretLineIndex(cm);
    const lines = textOf(cm).split('\n');
    const fm = frontmatterRange(lines);
    if (idx>=0 && isGuarded(lines[idx]||'', idx, fm)){
      e.preventDefault();
      const ln = cm.querySelectorAll('.ln')[idx];
      if (ln){ ln.classList.remove('flash'); void ln.offsetWidth; ln.classList.add('flash'); }
      const which = (lines[idx]||'').startsWith('id:') ? 'id is immutable'
        : 'approval is set via veri approve';
      setStatus(which, true);
      return;
    }
    // deleting into a guarded line from the line below
    if (e.inputType==='deleteContentBackward'){
      const sel = getSelection();
      if (sel.rangeCount && sel.getRangeAt(0).collapsed){
        const off = getCaret(cm);
        let acc=0;
        for (let i=0;i<lines.length;i++){
          if (off===acc && i>0 && isGuarded(lines[i-1], i-1, fm)){
            e.preventDefault();
            setStatus('approval is set via veri approve', true);
            return;
          }
          acc += lines[i].length+1;
        }
      }
    }
  });
  cm.addEventListener('input', ()=>{
    const ts = tabState(state.active);
    const caret = getCaret(cm);
    const text = textOf(cm);
    ts.buffer = text; ts.dirty = true;
    const lines = text.split('\n');
    const fm = frontmatterRange(lines);
    cm.innerHTML = lines.map((l,i)=>renderLineHtml(l,i,fm)).join('');
    if (caret!==null) setCaret(cm, caret);
    refreshChrome();
    maybeAutocomplete(cm);
  });
  cm.addEventListener('keydown', e=>{
    if (state.ac){
      if (e.key==='ArrowDown'){ e.preventDefault(); state.ac.sel++; renderAc(); return; }
      if (e.key==='ArrowUp'){ e.preventDefault(); state.ac.sel--; renderAc(); return; }
      if (e.key==='Enter' || e.key==='Tab'){ e.preventDefault(); acceptAc(cm); return; }
      if (e.key==='Escape'){ dismissAc(); return; }
    }
  });
  cm.addEventListener('click', e=>{
    const wl = e.target.closest('[data-wl]');
    if (wl && (e.metaKey||e.ctrlKey) && DOCS[wl.dataset.wl]){
      e.preventDefault(); openDoc(wl.dataset.wl);
    }
  });
  cm.addEventListener('blur', ()=>setTimeout(dismissAc, 150));
}
function refreshChrome(){
  // update dirty dot + status row without re-rendering the editor
  const ts = tabState(state.active);
  const tab = document.querySelector(`[data-tab="${state.active}"]`);
  if (tab) tab.classList.toggle('dirty', ts.dirty);
  const note = document.getElementById('statusNote');
  if (note && !state.status){ note.textContent = ts.dirty ? 'unsaved changes' : ''; note.classList.remove('warn','fade'); }
  const dot = document.querySelector('.statusrow .dot');
  if (ts.dirty && !dot){
    const row = document.querySelector('.statusrow');
    if (row){ const d=document.createElement('span'); d.className='dot'; row.prepend(d); }
  }
}
function save(){
  const ts = tabState(state.active);
  if (tabState(state.active).mode!=='edit' || !ts.dirty) return;
  let text = ts.buffer ?? DOCS[state.active].text;
  // the write path bumps only `updated:`
  text = text.replace(/^updated: .*$/m, `updated: ${TODAY}`);
  DOCS[state.active].text = text;
  const t = text.match(/^title: (.*)$/m); if (t) DOCS[state.active].title = t[1];
  ts.buffer = null; ts.dirty = false; ts.conflict = 'none';
  render();
  const cm = document.getElementById('cm'); if (cm) cm.focus();
  setStatus('saved');
}

/* ---------- autocomplete ---------- */
function maybeAutocomplete(cm){
  const sel = getSelection();
  if (!sel.rangeCount){ dismissAc(); return; }
  const idx = caretLineIndex(cm);
  if (idx<0){ dismissAc(); return; }
  const lines = textOf(cm).split('\n');
  const off = getCaret(cm);
  let lineStart = 0; for (let i=0;i<idx;i++) lineStart += lines[i].length+1;
  const before = lines[idx].slice(0, off-lineStart);
  const m = before.match(/\[\[([A-Za-z0-9-]*)$/);
  if (!m){ dismissAc(); return; }
  const q = m[1].toLowerCase();
  const items = Object.values(DOCS).filter(d=>
    d.id.toLowerCase().includes(q) || d.title.toLowerCase().includes(q));
  if (!items.length){ dismissAc(); return; }
  const r = sel.getRangeAt(0).cloneRange(); r.collapse(true);
  let rect = r.getBoundingClientRect();
  if (!rect.height){ rect = sel.anchorNode.parentElement.getBoundingClientRect(); }
  state.ac = { query:m[1], sel: state.ac ? Math.max(0,Math.min(state.ac.sel, items.length-1)) : 0,
    items, rect };
  renderAc();
}
function renderAc(){
  dismissAcEl();
  if (!state.ac) return;
  const a = state.ac;
  a.sel = ((a.sel % a.items.length) + a.items.length) % a.items.length;
  const pop = document.createElement('div');
  pop.className = 'pop ac'; pop.id='acpop';
  pop.innerHTML = a.items.map((d,i)=>`
    <div class="ac-row ${i===a.sel?'sel':''}" data-aci="${i}">
      <span class="aid" style="color:${TYPE[typeOf(d.id)].color}">${d.id}</span>
      <span class="at">${esc(d.title)}</span>
    </div>`).join('');
  document.body.appendChild(pop);
  const top = a.rect.bottom + 6, left = Math.min(a.rect.left, innerWidth - 290);
  pop.style.top = top+'px'; pop.style.left = left+'px';
  pop.querySelectorAll('[data-aci]').forEach(el=>el.onmousedown=e=>{
    e.preventDefault(); state.ac.sel = +el.dataset.aci;
    acceptAc(document.getElementById('cm'));
  });
}
function acceptAc(cm){
  const a = state.ac; if (!a) return;
  const chosen = a.items[a.sel];
  const off = getCaret(cm);
  const text = textOf(cm);
  const upto = text.slice(0, off);
  const start = upto.lastIndexOf('[['+a.query);
  const newText = text.slice(0, start) + `[[${chosen.id}]] ` + text.slice(off);
  const ts = tabState(state.active);
  ts.buffer = newText; ts.dirty = true;
  const lines = newText.split('\n');
  const fm = frontmatterRange(lines);
  cm.innerHTML = lines.map((l,i)=>renderLineHtml(l,i,fm)).join('');
  setCaret(cm, start + chosen.id.length + 5);
  dismissAc(); refreshChrome();
}
function dismissAcEl(){ document.getElementById('acpop')?.remove(); }
function dismissAc(){ state.ac = null; dismissAcEl(); }

/* ---------- new-document popover ---------- */
function openNewPop(type, rect){
  state.newPop = { type, rect }; renderNewPop();
}
function renderNewPop(){
  document.getElementById('newpop')?.remove();
  if (!state.newPop) return;
  const np = state.newPop;
  const pop = document.createElement('div');
  pop.className='pop newpop'; pop.id='newpop';
  pop.innerHTML = `
    <h5>New document</h5>
    <div class="segs">${Object.entries(TYPE).map(([t,m])=>`
      <span data-seg="${t}" style="${t===np.type?`background:${tint(m.color)};color:${m.color}`:''}">${m.prefix}</span>`).join('')}
    </div>
    <input id="newtitle" placeholder="Title" value="${np.title||''}">
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button class="btn ghost" id="newcancel">Cancel</button>
      <button class="btn primary" id="newcreate">Create</button>
    </div>`;
  document.body.appendChild(pop);
  if (np.rect){
    pop.style.top = Math.min(np.rect.bottom+6, innerHeight-200)+'px';
    pop.style.left = Math.min(np.rect.left, innerWidth-340)+'px';
  } else {
    pop.style.top='30%'; pop.style.left=`calc(50% - 160px)`;
  }
  const input = pop.querySelector('#newtitle'); input.focus();
  pop.querySelectorAll('[data-seg]').forEach(el=>el.onclick=()=>{
    np.type = el.dataset.seg; np.title = input.value; renderNewPop();
  });
  pop.querySelector('#newcancel').onclick = ()=>{ state.newPop=null; renderNewPop(); };
  const create = ()=>{
    const title = input.value.trim(); if (!title) return;
    const m = TYPE[np.type];
    const n = Math.max(0,...Object.keys(DOCS).filter(id=>id.startsWith(m.prefix))
      .map(id=>+id.split('-')[1])) + 1;
    const id = `${m.prefix}-${String(n).padStart(3,'0')}`;
    DOCS[id] = { id, title, status:m.status, text:
`---
id: ${id}
type: ${np.type}
title: ${title}
status: ${m.status}
created: ${TODAY}
updated: ${TODAY}
links: []
---

` };
    state.newPop = null; renderNewPop();
    openDoc(id);
    tabState(id).mode='edit'; render();
    const cm = document.getElementById('cm');
    if (cm){ cm.focus(); setCaret(cm, DOCS[id].text.length); }
  };
  pop.querySelector('#newcreate').onclick = create;
  input.onkeydown = e=>{ if (e.key==='Enter') create(); if (e.key==='Escape'){ state.newPop=null; renderNewPop(); } };
}

/* ---------- close-dirty popover ---------- */
function renderClosePop(){
  document.getElementById('closepop')?.remove();
  if (!state.closePop) return;
  const cp = state.closePop;
  const pop = document.createElement('div');
  pop.className='pop closepop'; pop.id='closepop';
  pop.innerHTML = `<p><strong style="color:#E7E4DE">Unsaved changes</strong><br>${cp.id} has edits that aren't saved.</p>
    <div class="row">
      <button class="btn ghost" id="cpCancel">Cancel</button>
      <button class="btn ghost" id="cpDiscard">Discard</button>
      <button class="btn primary" id="cpSave">Save</button>
    </div>`;
  document.body.appendChild(pop);
  pop.style.top = (cp.rect.bottom+8)+'px';
  pop.style.left = Math.min(cp.rect.left-120, innerWidth-260)+'px';
  pop.querySelector('#cpCancel').onclick=()=>{ state.closePop=null; renderClosePop(); };
  pop.querySelector('#cpDiscard').onclick=()=>{ const id=cp.id; state.closePop=null; renderClosePop(); closeTab(id); };
  pop.querySelector('#cpSave').onclick=()=>{
    const id=cp.id; state.closePop=null; renderClosePop();
    const ts = tabState(id);
    let text = (ts.buffer ?? DOCS[id].text).replace(/^updated: .*$/m, `updated: ${TODAY}`);
    DOCS[id].text = text; ts.dirty=false; ts.buffer=null;
    closeTab(id);
  };
}

/* ---------- external-change simulation ---------- */
function simulateExternal(){
  const id = state.active, ts = tabState(id);
  DOCS[id].text = DOCS[id].text.replace(/^updated: .*$/m, 'updated: 2026-08-12')
    .replace(/\n$/,'') + '\n\n> note appended by an agent outside the app\n';
  if (ts.mode==='edit' && ts.dirty){
    ts.conflict = 'disk-changed'; render();
    const cm=document.getElementById('cm'); if(cm) cm.focus();
  } else {
    ts.buffer = null; ts.dirty = false;
    render();
    if (ts.mode==='edit'){ setStatus('reloaded from disk'); }
  }
}
function resolveConflict(action){
  const ts = tabState(state.active);
  if (action==='reload'){ ts.buffer=null; ts.dirty=false; ts.conflict='none'; render(); setStatus('reloaded from disk'); }
  if (action==='keep'){ ts.conflict='none'; render(); setStatus('kept your edits — ⌘S overwrites'); }
  if (action==='restore'){ ts.conflict='none'; save(); }
  if (action==='closetab'){ ts.dirty=false; ts.conflict='none'; closeTab(state.active); }
}

/* ---------- global keys ---------- */
addEventListener('keydown', e=>{
  const mod = e.metaKey||e.ctrlKey;
  if (mod && e.key==='e'){ e.preventDefault();
    setMode(tabState(state.active).mode==='read'?'edit':'read'); }
  if (mod && e.key==='s'){ e.preventDefault(); save(); }
  if (mod && e.key==='n'){ e.preventDefault(); openNewPop('requirement', null); }
});
addEventListener('mousedown', e=>{
  if (state.newPop && !e.target.closest('#newpop') && !e.target.closest('[data-newtype]')){
    state.newPop=null; renderNewPop();
  }
  if (state.closePop && !e.target.closest('#closepop')){
    state.closePop=null; renderClosePop();
  }
});

render();
</script>
